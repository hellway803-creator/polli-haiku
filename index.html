<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>polli-haiku — AI haiku written &amp; illustrated by Pollinations</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; font-family: ui-monospace, monospace; }
  body { max-width: 640px; margin: 0 auto; padding: 16px; background: #101014; color: #e8e8ec; text-align: center; }
  h1 { font-size: 1.5rem; }
  .card { border: 1px solid #333; border-radius: 12px; padding: 16px; margin: 12px 0; background: #181820; }
  input[type=text] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #111; color: #eee; font-size: 1rem; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: #6c5ce7; color: #fff; cursor: pointer; margin-top: 10px; font-size: 1rem; }
  button:disabled { opacity: 0.5; cursor: wait; }
  img { max-width: 100%; border-radius: 10px; margin-top: 12px; border: 1px solid #333; }
  pre { white-space: pre-wrap; font-family: inherit; font-size: 1.1rem; line-height: 1.6; min-height: 70px; border: 1px dashed #444; border-radius: 8px; padding: 12px; background: #101018; }
  .hint { color: #999; font-size: 0.85rem; }
  .err { color: #ff7675; }
  .ok { color: #55efc4; }
</style>
</head>
<body>
<h1>🌊 polli-haiku</h1>
<p class="hint">Give a mood or topic — the <b>Pollinations LLM</b> writes a haiku and the <b>Pollinations image model</b> illustrates it. You pay your own Pollen with your key.</p>

<div class="card">
  <input type="text" id="topic" placeholder="e.g. rainy morning in Jakarta, a tired cat, waiting for my code to compile">
  <button id="go">Write haiku + art ✨</button>
  <div id="status" class="hint"></div>
  <pre id="haiku"></pre>
  <div id="imgWrap"></div>
  <a id="download" hidden download="haiku.png">⬇ Download art</a>
</div>

<div class="card">
  <input type="password" id="apiKey" placeholder="Pollinations API key (enter.pollinations.ai/keys)">
  <p class="hint">Key stays in your browser. BYOP — the image & text calls are billed to your account.</p>
</div>

<script src="pollinations-client.js"></script>
<script src="app.js"></script>
</body>
</html>
